# Keeps the profile README alive on its own: fetches GitHub data, redraws every image,
# rewrites README.md and commits. Nothing here depends on third-party actions or services,
# only on git, python3 (both preinstalled on GitHub's runners) and GitHub's own API.
# Toolbox icons are cached in data/icons.json; a pinned icon set is downloaded only
# when a new language, framework or platform shows up in your repos.
name: Refresh profile README

on:
  schedule:
    - cron: "0 3 * * *"        # every day at 03:00 UTC
  workflow_dispatch:            # run it by hand from the Actions tab
  push:
    branches: [main]
    paths-ignore: ["assets/**", "data/**", "README.md"]

permissions:
  contents: write

concurrency:
  group: refresh-readme
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Clone
        run: git clone --depth 1 "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" .

      - name: Fetch data, draw images, write README.md
        run: python3 scripts/readme_gen.py
        env:
          # Optional: add a personal access token as the STATS_TOKEN secret
          # to include private contributions. Otherwise public data is used.
          GH_TOKEN: ${{ secrets.STATS_TOKEN || secrets.GITHUB_TOKEN }}
          GH_LOGIN: ${{ github.repository_owner }}

      - name: Commit and push
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md assets data
          git diff --cached --quiet || git commit -m "chore: refresh profile README ($(date -u +%Y-%m-%d))"
          git push
